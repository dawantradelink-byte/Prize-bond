name: Official Data Release APK v2

on:
  push:
    branches: ["fix/data-integrity-2026-09"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Download official Bangladesh Bank results
        run: |
          set -euo pipefail
          mkdir -p /tmp/prizebond
          for draw in 124th 123rd 122nd 121st 120th 119th 118th 117th; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://www.bb.org.bd/investfacility/prizebond/${draw}draw.pdf" \
              -o "/tmp/prizebond/${draw}.pdf"
            pdftotext -layout "/tmp/prizebond/${draw}.pdf" "/tmp/prizebond/${draw}.txt"
          done

      - name: Generate and validate official dataset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib

          meta = [
              ("124th", 124, "02 August 2026"),
              ("123rd", 123, "30 April 2026"),
              ("122nd", 122, "01 February 2026"),
              ("121st", 121, "02 November 2025"),
              ("120th", 120, "31 July 2025"),
              ("119th", 119, "30 April 2025"),
              ("118th", 118, "02 February 2025"),
              ("117th", 117, "31 October 2024"),
          ]
          prize_amounts = [600000, 325000, 100000, 100000, 50000, 50000] + [10000] * 40
          tiers = [1, 2, 3, 3, 4, 4] + [5] * 40

          draws, winning = [], []
          for slug, draw_no, date in meta:
              pdf = Path("/tmp/prizebond") / f"{slug}.pdf"
              raw = (Path("/tmp/prizebond") / f"{slug}.txt").read_text(errors="ignore")
              raw = raw.translate(str.maketrans("০১২৩৪৫৬৭৮৯", "0123456789"))
              # The official PDF states the bond range before listing the 46 winners.
              # Start immediately after that range marker and stop before the summary table.
              marker = "0000001"
              start = raw.find(marker)
              if start < 0:
                  raise SystemExit(f"{slug}: could not find official bond-range marker")
              start += len(marker)
              end = raw.find("\n[", start)
              if end < 0:
                  raise SystemExit(f"{slug}: could not find end of official prize-result block")
              prize_section = raw[start:end]
              nums = re.findall(r"(?<!\d)\d{7}(?!\d)", prize_section)
              if len(nums) != 46 or len(set(nums)) != 46:
                  raise SystemExit(f"{slug}: expected 46 unique 7-digit winning numbers in prize-result block, got {len(nums)}")
              digest = hashlib.sha256(pdf.read_bytes()).hexdigest()
              draws.append((draw_no, date, digest, f"https://www.bb.org.bd/investfacility/prizebond/{slug}draw.pdf"))
              winning.extend((draw_no, tier, amount, number, date)
                             for number, tier, amount in zip(nums, tiers, prize_amounts))

          out = Path("app/src/main/java/com/example/data/remote/OfficialBangladeshBankData.kt")
          lines = [
              "package com.example.data.remote", "",
              "import com.example.data.model.DrawResult",
              "import com.example.data.model.WinningNumber", "",
              "/** Official Bangladesh Bank 100 Taka Prize Bond results. Generated from official PDFs. */",
              "object OfficialBangladeshBankData {",
              "  data class Source(val drawNumber: Int, val url: String, val sha256: String)", "",
              "  val sources: List<Source> = listOf("
          ]
          for draw_no, date, digest, url in draws:
              lines.append(f'    Source({draw_no}, "{url}", "{digest}"),')
          lines += ["  )", "", "  fun getOfficialDraws(): List<DrawResult> = listOf("]
          for draw_no, date, digest, url in draws:
              lines.append(f'    DrawResult(drawNumber = {draw_no}, drawDate = "{date}", drawPlace = "Dhaka", seriesCount = 0, validUntil = "", isOfficial = true),')
          lines += ["  )", "", "  fun getWinningNumbers(): List<WinningNumber> = listOf("]
          for draw_no, tier, amount, number, date in winning:
              desc = {1:"1st Prize",2:"2nd Prize",3:"3rd Prize",4:"4th Prize",5:"5th Prize"}[tier]
              lines.append(f'    WinningNumber(drawNumber = {draw_no}, prizeTier = {tier}, prizeAmount = {amount}, winningNumber = "{number}", prizeDescription = "{desc}", drawDate = "{date}"),')
          lines += ["  )", "}",""]
          out.write_text("\n".join(lines))

          repo = Path("app/src/main/java/com/example/data/repository/PrizeBondRepository.kt")
          s = repo.read_text()
          if "import com.example.data.remote.OfficialBangladeshBankData" not in s:
              s = s.replace(
                  "import com.example.data.remote.BangladeshBankRemoteDataSource",
                  "import com.example.data.remote.BangladeshBankRemoteDataSource\nimport com.example.data.remote.OfficialBangladeshBankData"
              )
          s = re.sub(
              r"  suspend fun ensureInitialDataLoaded\(\) = withContext\(Dispatchers\.IO\) \{.*?\n  \}",
              """  suspend fun ensureInitialDataLoaded() = withContext(Dispatchers.IO) {
              if (dao.getDrawCount() == 0) {
                dao.insertDrawResults(OfficialBangladeshBankData.getOfficialDraws())
              }
              if (dao.getWinningNumberCount() == 0) {
                dao.insertWinningNumbers(OfficialBangladeshBankData.getWinningNumbers())
              }
            }""",
              s, count=1, flags=re.S
          )
          repo.write_text(s)
          print(f"Validated {len(winning)} official winning numbers across {len(draws)} draws.")
          PY

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Debug APK build
        run: gradle assembleDebug

      - name: Commit verified dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/remote/OfficialBangladeshBankData.kt app/src/main/java/com/example/data/repository/PrizeBondRepository.kt
          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit -m "feat: load verified Bangladesh Bank prize data [skip ci]"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prize-bond-official-data-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
